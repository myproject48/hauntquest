name: Validate release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 tool/check_release.py
      - run: sh tool/hooks/run.sh scan
      - name: Build evaluation APK (development certificate)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hauntquest-ai-evaluation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
